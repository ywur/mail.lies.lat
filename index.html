<!DOCTYPE html>
<html lang="en">

<title>mail.pawsocks.lat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #000;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  transition: background 0.2s ease;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

::selection { background: #fff; color: #000; }

:focus-visible {
  outline: 1px solid rgba(255,255,255,0.3);
  outline-offset: 2px;
  border-radius: 2px;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes itemIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

.auth-screen, .landing-screen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.auth-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 300px;
  animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.auth-title, .landing-logo {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
  opacity: 0.22;
  margin-bottom: 8px;
  animation: fadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}

.username-wrap {
  display: flex;
  align-items: baseline;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  width: 100%;
  transition: border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.username-wrap:focus-within { border-color: rgba(255,255,255,0.4); }

.username-wrap input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  padding: 8px 0;
  outline: none;
  text-align: right;
}

.username-suffix {
  font-size: 13px;
  color: rgba(255,255,255,0.22);
  padding: 8px 0 8px 1px;
  transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.username-wrap:focus-within .username-suffix { color: rgba(255,255,255,0.5); }

.auth-field input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  padding: 8px 0;
  outline: none;
  text-align: center;
  transition: border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.auth-field input:focus { border-bottom-color: rgba(255,255,255,0.4); }

.landing-btns {
  display: flex;
  gap: 16px;
  margin-top: 20px;
  animation: slideUp 0.6s 0.1s cubic-bezier(0.4, 0, 0.2, 1) both;
}

.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.45);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 11px 28px;
  cursor: pointer;
  border-radius: 2px;
  transition: border-color 0.22s, color 0.22s, background 0.22s, transform 0.16s;
}
.btn:hover { border-color: rgba(255,255,255,0.24); color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.03); }
.btn:active { transform: scale(0.97); }

.btn-sm { padding: 7px 14px; font-size: 9px; letter-spacing: 2px; }
.btn-primary { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }
.btn-primary:hover { border-color: rgba(255,255,255,0.35); color: #fff; background: rgba(255,255,255,0.05); }

.btn-icon {
  background: transparent; border: none; color: rgba(255,255,255,0.3); cursor: pointer;
  padding: 5px 8px; font-family: inherit; font-size: 11px; border-radius: 2px;
  transition: color 0.2s, background 0.2s, transform 0.16s;
}
.btn-icon:hover { color: #fff; background: rgba(255,255,255,0.05); }
.btn-icon:active { transform: scale(0.92); }

.auth-links { font-size: 10px; color: rgba(255,255,255,0.15); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.auth-links a { color: rgba(255,255,255,0.42); text-decoration: none; transition: color 0.2s; }
.auth-links a:hover { color: #fff; }

#app { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.35s; }

.topbar {
  height: 42px; border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; padding: 0 18px; gap: 14px; flex-shrink: 0; background: #000;
}
.topbar-brand { font-size: 10px; letter-spacing: 4px; opacity: 0.2; }
.topbar-addr { font-size: 10px; color: rgba(255,255,255,0.35); }
.topbar-right { margin-left: auto; }

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 200px; border-right: 1px solid rgba(255,255,255,0.05);
  padding: 14px 0 0; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; background: #000;
}

.compose-btn {
  margin: 0 12px 14px; background: transparent; border: 1px solid rgba(255,255,255,0.09);
  color: rgba(255,255,255,0.55); font-family: inherit; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; padding: 11px; cursor: pointer; text-align: center;
  width: calc(100% - 24px); border-radius: 2px; transition: border-color 0.22s, color 0.22s, background 0.22s;
}
.compose-btn:hover { border-color: rgba(255,255,255,0.28); color: #fff; background: rgba(255,255,255,0.04); }

.nav-item, .folder-item {
  padding: 7px 16px; cursor: pointer; font-size: 10px; color: rgba(255,255,255,0.35);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-left: 2px solid transparent; transition: background 0.18s, color 0.18s, padding-left 0.18s;
}
.nav-item:hover, .folder-item:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.75); padding-left: 18px; }
.nav-item.active, .folder-item.active { color: #fff; background: rgba(255,255,255,0.055); border-left-color: rgba(255,255,255,0.45); }

.folder-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder-badge {
  font-size: 9px; background: rgba(255,255,255,0.15); color: #fff; padding: 0 5px;
  border-radius: 8px; min-width: 16px; text-align: center; line-height: 14px; height: 14px;
}

.sidebar-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 12px 12px 0; flex-shrink: 0; }
.sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
.section-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.18); padding: 12px 16px 6px; }

.email-list-pane { width: 340px; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; flex-shrink: 0; background: #000; }
.pane-header { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.pane-title { font-size: 11px; color: rgba(255,255,255,0.75); letter-spacing: 1px; }

.search-bar { padding: 8px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
.search-bar input {
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  color: #fff; font-family: inherit; font-size: 11px; padding: 7px 10px; outline: none; border-radius: 2px; transition: border-color 0.22s;
}
.search-bar input:focus { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); }

.email-list { overflow-y: auto; flex: 1; }
.email-item {
  display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03);
  cursor: pointer; transition: background 0.18s, padding-left 0.18s; position: relative; animation: slideDown 0.3s;
}
.email-item:hover { background: rgba(255,255,255,0.035); padding-left: 16px; }
.email-item.active { background: rgba(255,255,255,0.055); }

.email-avatar {
  width: 26px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.04);
}
.email-item.unread .email-avatar { background: rgba(255,255,255,0.11); color: #fff; border-color: rgba(255,255,255,0.18); }

.email-main { flex: 1; min-width: 0; }
.email-top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.email-dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; flex-shrink: 0; animation: pulse 2s infinite; }
.email-from { flex: 1; font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.email-item.unread .email-from { color: #fff; font-weight: 500; }
.email-time { font-size: 9px; color: rgba(255,255,255,0.22); flex-shrink: 0; }
.email-subject { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
.email-item.unread .email-subject { color: rgba(255,255,255,0.78); }
.email-preview { font-size: 10px; color: rgba(255,255,255,0.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.detail-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; }
.detail-empty { text-align: center; margin-top: 40px; opacity: 0.2; animation: fadeIn 0.4s; }
.detail-view { animation: fadeIn 0.3s; flex-direction: column; height: 100%; }
.detail-header { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); animation: slideDown 0.35s; }
.detail-subject { font-size: 15px; margin-bottom: 10px; color: #fff; line-height: 1.35; }
.detail-meta { font-size: 11px; color: rgba(255,255,255,0.42); }
.detail-date { font-size: 9px; opacity: 0.3; margin-top: 4px; }

.detail-body {
  flex: 1; overflow-y: auto; padding: 24px; color: rgba(255,255,255,0.75);
  word-break: break-word; animation: fadeIn 0.4s 0.05s both; display: flex; flex-direction: column;
}

/* IFRAME FOR DISCORD EMBEDS */
.email-html-frame {
  display: block; width: 100%; min-height: 420px; flex: 1;
  border: 0; border-radius: 8px; background: #fff;
}
.email-text-content {
  white-space: pre-wrap; overflow-wrap: anywhere;
  font: 13px/1.75 Inter, ui-sans-serif, system-ui, sans-serif;
}

.reply-area { border-top: 1px solid rgba(255,255,255,0.05); padding: 14px 24px; animation: slideUp 0.4s 0.1s both; }
.reply-area textarea {
  width: 100%; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.72); font-family: inherit; font-size: 12px; padding: 10px;
  min-height: 76px; outline: none; border-radius: 2px; resize: vertical; line-height: 1.6;
}
.reply-area textarea:focus { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.035); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; visibility: hidden; transition: opacity 0.22s, visibility 0.22s; backdrop-filter: blur(3px);
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08); width: 500px; max-width: 95vw;
  border-radius: 3px; transform: scale(0.96) translateY(6px); opacity: 0; transition: transform 0.25s, opacity 0.25s;
  box-shadow: 0 24px 60px rgba(0,0,0,0.65);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); opacity: 1; }
.modal-header { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
.modal-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.42); }
.modal-field { padding: 10px 20px; display: flex; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; }
.modal-field label { width: 40px; opacity: 0.32; font-size: 10px; text-transform: uppercase; }
.modal-field input, .modal-body textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: inherit; font-size: 12px; }
.modal-body { padding: 0; }
.modal-body textarea { min-height: 150px; width: 100%; padding: 16px 20px; line-height: 1.6; resize: vertical; }
.modal-footer { padding: 12px 20px; display: flex; gap: 8px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
.modal-status { margin-left: auto; font-size: 9px; color: rgba(255,255,255,0.35); text-transform: uppercase; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: #0e0e0e; border: 1px solid rgba(255,255,255,0.09);
  padding: 12px 20px; font-size: 10px; border-radius: 3px; opacity: 0; transform: translateY(10px);
  pointer-events: none; transition: opacity 0.28s, transform 0.28s; z-index: 200;
}
.toast.show { opacity: 1; transform: translateY(0); }

.err { font-size: 10px; color: rgba(255,90,90,0.75); text-align: center; min-height: 12px; }
.empty-state { text-align: center; padding: 40px 16px; opacity: 0.28; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }

/* Monochrome & Paw Field */

<div class="paw-field" aria-hidden="true"><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span></div>

<div id="landing-screen" class="landing-screen">
  <div class="landing-logo">mail.pawsocks.lat</div>
  <div class="landing-btns">
    <button class="btn" onclick="showAuth('login')">sign in</button>
    <button class="btn" onclick="showAuth('register')">create account</button>
  </div>
</div>

<div id="login-screen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <div class="auth-title">sign in</div>
    <div class="username-wrap">
      <input type="text" id="login-username" placeholder="username" autofocus autocomplete="username">
      <span class="username-suffix">@pawsocks.lat</span>
    </div>
    <div class="auth-field">
      <input type="password" id="login-password" placeholder="password" autocomplete="current-password">
    </div>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">enter</button>
    <div class="auth-links">
      <a href="#" onclick="showAuth('register');return false;">create account</a>
      <span class="sep">/</span>
      <a href="#" onclick="showAuth('landing');return false;">back</a>
    </div>
  </div>
</div>

<div id="register-screen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <div class="auth-title">create account</div>
    <div class="username-wrap">
      <input type="text" id="reg-username" placeholder="username" autocomplete="username">
      <span class="username-suffix">@pawsocks.lat</span>
    </div>
    <div class="auth-field">
      <input type="password" id="reg-password" placeholder="password" autocomplete="new-password">
    </div>
    <div class="auth-field">
      <input type="password" id="reg-password2" placeholder="confirm password" autocomplete="new-password">
    </div>
    <div class="err" id="reg-err"></div>
    <button class="btn" onclick="doRegister()">register</button>

<script>
const SUPABASE_URL = 'https://ikjddbndbwnisxtlraru.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlramRkYm5kYnduaXN4dGxyYXJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MzI1NDQsImV4cCI6MjExMDEwODU0NH0.OUL3AfrIzWqgkV5TLZ4WO3My3exPJmmDypbOjaPYTTc';

const storage = {
  getItem: k => localStorage.getItem(k),
  setItem: (k, v) => localStorage.setItem(k, v),
  removeItem: k => localStorage.removeItem(k)
};

let currentUser = null;
let currentSession = null;
let accounts = [];
let activeAccountId = null;
const MAX_ACCOUNTS = 5;
let allEmails = [];
let currentFolder = 'inbox';
let refreshTimer = null;
let myEmail = '';
let selectedId = null;

const $ = id => document.getElementById(id);

function showToast(msg) {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function showAuth(screen) {
  document.body.classList.add('auth-mode');
  $('app').style.display = 'none';
  $('landing-screen').style.display = screen === 'landing' ? 'flex' : 'none';
  $('login-screen').style.display = screen === 'login' ? 'flex' : 'none';
  $('register-screen').style.display = screen === 'register' ? 'flex' : 'none';
  if (screen === 'login') $('login-username').focus();
  if (screen === 'register') $('reg-username').focus();
}

async function authRequest(path, body) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  let data = {};
  try { data = await res.json(); } catch { }
  if (!res.ok) {
    const message = data.msg || data.message || data.error_description || data.error || `Authentication failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

function saveSession(session, email) {
  if (!session?.access_token || !session?.user?.id) throw new Error('Invalid login session.');
  currentSession = session;
  currentUser = session.user;
  myEmail = email || session.user.email || '';
  const id = session.user.id;
  const existing = accounts.findIndex(a => a.userId === id);
  const profile = session.user.user_metadata || {};
  const record = { userId:id, session, email:myEmail, username:profile.username || myEmail.split('@')[0], avatarUrl:profile.avatar_url || '' };
  if (existing >= 0) accounts[existing] = record;
  else {
    if (accounts.length >= MAX_ACCOUNTS) throw new Error('Maximum of 5 accounts reached.');
    accounts.push(record);
  }
  activeAccountId = id;
  persistAccounts();
  renderAccountDock();
}

function persistAccounts(){ storage.setItem('accounts', JSON.stringify({accounts, activeAccountId})); }
function accountInitial(a){ return (a?.username || a?.email || '?').trim().charAt(0).toUpperCase() || '?'; }
function avatarFallback(){ return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#242424"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#eee" font-family="Arial" font-size="32">${accountInitial(accounts.find(a=>a.userId===activeAccountId))}</text></svg>`); }
function renderAccountDock(){
  const active=accounts.find(a=>a.userId===activeAccountId);
  if(!active)return;
  $('account-name').textContent=active.username || active.email.split('@')[0];
  $('account-email').textContent=active.email;
  $('account-avatar').src=active.avatarUrl || avatarFallback();
  $('topbar-addr').textContent=active.email;
  $('account-count').textContent=`${accounts.length} / ${MAX_ACCOUNTS}`;
  $('add-account-btn').style.display=accounts.length>=MAX_ACCOUNTS?'none':'block';
  $('account-list').innerHTML=accounts.map(a=>`<button class="account-option ${a.userId===activeAccountId?'active':''}" onclick="switchAccount('${a.userId}')"><img src="${escapeHtml(a.avatarUrl || avatarFallbackFor(a))}" alt=""><span>${escapeHtml(a.username || a.email.split('@')[0])}<small>${escapeHtml(a.email)}</small></span></button>`).join('');
}
function avatarFallbackFor(a){ return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#242424"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#eee" font-family="Arial" font-size="32">${accountInitial(a)}</text></svg>`); }
function toggleAccountMenu(){ const m=$('account-menu'); m.style.display=m.style.display==='none'?'block':'none'; }
function addAccount(){ if(accounts.length>=MAX_ACCOUNTS)return showToast('Maximum of 5 accounts reached'); $('account-menu').style.display='none'; showAuth('login'); $('login-err').textContent='Sign in to add another account.'; }
async function switchAccount(userId){
  const a=accounts.find(x=>x.userId===userId); if(!a||userId===activeAccountId)return;
  if(refreshTimer)clearInterval(refreshTimer); refreshTimer=null;
  activeAccountId=userId; currentSession=a.session; currentUser=a.session.user; myEmail=a.email; allEmails=[]; selectedId=null;
  $('account-menu').style.display='none';
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${currentSession.access_token}`}});
    if(res.status===401&&currentSession.refresh_token) await refreshSession();
    else if(res.ok){ currentUser=await res.json(); a.session.user=currentUser; }
    else throw new Error('Session expired. Sign in again.');
    a.session=currentSession; persistAccounts(); renderAccountDock(); await enterApp();
  }catch(e){ showToast(e.message); }
}
async function triggerAvatarUpload(){ $('account-menu').style.display='none'; $('avatar-upload').click(); }
async function uploadAvatar(event){
  const file=event.target.files?.[0]; event.target.value=''; if(!file)return;
  if(file.size>3*1024*1024) return showToast('Image under 3 MB');
  if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return showToast('Use PNG, JPG, WEBP or GIF');
  try{
    const ext=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[file.type]||'png';
    const path=`${currentUser.id}/avatar.${ext}`;
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/avatars/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${currentSession.access_token}`,'x-upsert':'true','Content-Type':file.type},body:file});
    if(!res.ok)throw new Error(await res.text());
    const url=`${SUPABASE_URL}/storage/v1/object/public/avatars/${path}?v=${Date.now()}`;
    const update=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${currentSession.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({data:{...currentUser.user_metadata,avatar_url:url}})});
    if(!update.ok)throw new Error(await update.text());
    currentUser=await update.json(); const a=accounts.find(x=>x.userId===activeAccountId); a.avatarUrl=url; a.session.user=currentUser; persistAccounts(); renderAccountDock(); showToast('Profile picture updated');
  }catch(e){ showToast('Avatar upload failed: ' + e.message); }
}

async function refreshSession() {
  if (!currentSession?.refresh_token) throw new Error('Session expired.');
  const email = myEmail || currentUser?.email || '';
  const refreshed = await authRequest('/auth/v1/token?grant_type=refresh_token', { refresh_token: currentSession.refresh_token });
  saveSession(refreshed, email);
  return refreshed;
}

async function sbFetch(path, options = {}) {
  if (!currentSession?.access_token) throw new Error('No login session.');
  const makeRequest = () => fetch(`${SUPABASE_URL}${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      'Content-Type': 'application/json',
      Authorization: `Bearer ${currentSession.access_token}`,
      ...(options.headers || {})
    }
  });
  let res = await makeRequest();
  if (res.status === 401 && currentSession?.refresh_token) {
    await refreshSession();
    res = await makeRequest();
  }
  if (!res.ok) throw new Error(await res.text() || `Request failed (${res.status})`);
  if (res.status === 204) return null;
  return res.json();
}

function clearSession() {
  currentSession = null; currentUser = null; allEmails = []; myEmail = ''; selectedId = null;
  if (refreshTimer) clearInterval(refreshTimer); refreshTimer = null;
  accounts = accounts.filter(a => a.userId !== activeAccountId);
  activeAccountId = accounts[0]?.userId || null;
  persistAccounts();
}

async function enterApp() {
  document.body.classList.remove('auth-mode');
  $('app').style.display = 'flex';
  $('landing-screen').style.display = 'none';
  $('login-screen').style.display = 'none';
  $('register-screen').style.display = 'none';
  $('topbar-addr').textContent = myEmail;
  $('detail-view').style.display = 'none';
  $('detail-empty').style.display = 'block';
  currentFolder = 'inbox';
  await loadEmails();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadEmails, 15000);
}

async function doLogin() {
  const username = $('login-username').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-err'); errEl.textContent = '';
  if (!username) return (errEl.textContent = 'enter username');
  if (!password) return (errEl.textContent = 'enter password');
  const button = $('login-screen').querySelector('button.btn');
  if (button) { button.disabled = true; button.textContent = 'signing in...'; }
  try {
    const email = `${username}@pawsocks.lat`;
    const session = await authRequest('/auth/v1/token?grant_type=password', { email, password });
    saveSession(session, email);
    $('login-password').value = '';
    await enterApp();
  } catch (err) { errEl.textContent = err.message || 'Sign in failed.'; }
  finally { if (button) { button.disabled = false; button.textContent = 'enter'; } }
}

async function doRegister() {
  const username = $('reg-username').value.trim().toLowerCase();
  const password = $('reg-password').value;
  const password2 = $('reg-password2').value;
  const errEl = $('reg-err');
  const button = $('register-screen').querySelector('button.btn');
  errEl.textContent = '';
  if (!/^[a-z0-9._-]{2,30}$/.test(username)) return (errEl.textContent = 'use 2–30 letters, numbers, dots, underscores or hyphens');
  if (password.length < 6) return (errEl.textContent = 'password min 6 chars');
  if (password !== password2) return (errEl.textContent = 'passwords do not match');
  if (button) { button.disabled = true; button.textContent = 'creating...'; }
  try {
    const email = `${username}@pawsocks.lat`;
    const data = await authRequest('/auth/v1/signup', { email, password, data: { username } });
    let session = data;
    if (!session?.access_token) {
      try { session = await authRequest('/auth/v1/token?grant_type=password', { email, password }); }
      catch { throw new Error('Account created, but email confirmation is required. Turn OFF Confirm email in Supabase settings.'); }
    }
    saveSession(session, email);
    $('reg-password').value = ''; $('reg-password2').value = '';
    await enterApp();
  } catch (err) { errEl.textContent = err.message || 'Could not create account.'; }
  finally { if (button) { button.disabled = false; button.textContent = 'register'; } }
}

async function loadEmails() {
  if (!currentSession) return;
  try {
    let query = `/rest/v1/emails?select=*&order=received_at.desc.nullslast`;
    if (currentUser?.id) query += `&user_id=eq.${currentUser.id}`;
    const data = await sbFetch(query, {});
    allEmails = Array.isArray(data) ? data : [];
    renderEmailList();
    updateUnreadCount();
  } catch (err) {
    $('email-list').innerHTML = `<div class="empty-state">error: ${escapeHtml(err.message)}</div>`;
  }
}

function getFilteredEmails() {
  let list = allEmails;
  if (currentFolder === 'sent') list = list.filter(e => e.folder === 'sent');
  else if (currentFolder === 'inbox') list = list.filter(e => e.folder !== 'sent' && !e.is_deleted);
  
  const search = ($('search-input')?.value || '').toLowerCase().trim();
  if (search) {
    list = list.filter(e =>
      (e.subject || '').toLowerCase().includes(search) ||
      (e.from_address || '').toLowerCase().includes(search) ||
      (e.body_text || '').toLowerCase().includes(search)
    );
  }
  return list;
}

function renderEmailList() {
  const container = $('email-list');
  const filtered = getFilteredEmails();
  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state">${$('search-input')?.value ? 'no results' : 'no messages'}</div>`;
    return;
  }
  container.innerHTML = filtered.map((email, i) => {
    const isActive = email.id === selectedId;
    const isSent = email.folder === 'sent';
    const sender = isSent ? `to: ${email.to_address || '—'}` : (email.from_name || email.from_address || 'unknown');
    const avatar = (sender.replace(/^to:\s*/, '').match(/[a-z0-9]/i) || ['?'])[0].toUpperCase();
    const preview = (email.body_text || stripHtml(email.body_html) || '').slice(0, 90);
    const delay = Math.min(i * 18, 180);
    return `
      <div class="email-item ${email.is_read ? '' : 'unread'} ${isActive ? 'active' : ''}"
           data-id="${email.id}" style="animation-delay:${delay}ms" onclick="viewEmail('${email.id}')">
        <div class="email-avatar">${escapeHtml(avatar)}</div>
        <div class="email-main">
          <div class="email-top">
            ${email.is_read ? '' : '<span class="email-dot"></span>'}
            <span class="email-from">${escapeHtml(sender)}</span>
            <span class="email-time">${formatDate(email.received_at)}</span>
          </div>
          <div class="email-subject">${escapeHtml(email.subject || '(no subject)')}</div>
          <div class="email-preview">${escapeHtml(preview)}</div>
        </div>
      </div>
    `;
  }).join('');
}

// THIS IS THE MAGIC THAT RENDERS THE EMBEDS
function renderEmailContent(email) {
  const container = $('detail-body');
  const html = email.body_html || email.html_body || '';
  const text = email.body_text || email.text_body || '';

  if (typeof html === 'string' && html.trim()) {
    const frame = document.createElement('iframe');
    frame.className = 'email-html-frame';
    frame.title = 'Email content';
    frame.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
    frame.referrerPolicy = 'no-referrer';
    
    // Inject the HTML into the iframe with a clean stylesheet
    const safeDocument = `<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;max-width:100%;overflow-wrap:anywhere}
body{padding:20px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#202124;background:#fff}
img{max-width:100%;height:auto}table{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}
a{overflow-wrap:anywhere}iframe,video{max-width:100%}
</style></head><body>${html}</body></html>`;
    frame.srcdoc = safeDocument;
    container.replaceChildren(frame);
    return;
  }

  const content = document.createElement('div');
  content.className = 'email-text-content';
  content.textContent = text || stripHtml(html) || '(no content)';
  container.replaceChildren(content);
}

async function viewEmail(id) {
  const email = allEmails.find(e => e.id === id);
  if (!email) return;
  selectedId = id;
  $('detail-empty').style.display = 'none';
  $('detail-view').style.display = 'flex';
  $('detail-subject').textContent = email.subject || '(no subject)';
  $('detail-from').textContent = email.from_address || email.from_name;
  $('detail-to').textContent = email.to_address;
  $('detail-date').textContent = formatDateTime(email.received_at);
  renderEmailContent(email);
  $('reply-text').placeholder = `Reply to ${email.from_address || ''}`;
  document.querySelectorAll('.email-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  
  if (!email.is_read) {
    email.is_read = true;
    renderEmailList();
    updateUnreadCount();
    try { await sbFetch(`/rest/v1/emails?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ is_read: true }) }); } catch {}
  }
}

function setFolder(folder, el) {
  currentFolder = folder;
  selectedId = null;
  document.querySelectorAll('[data-folder]').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  $('pane-title').textContent = folder;
  $('detail-view').style.display = 'none';
  $('detail-empty').style.display = 'block';
  renderEmailList();
}

function updateUnreadCount() {
  const count = allEmails.filter(e => e.folder !== 'sent' && !e.is_read && !e.is_deleted).length;
  $('unread-count').textContent = count > 0 ? count : '';
}

function refreshEmails() {
  $('email-list').innerHTML = '<div class="empty-state">loading...</div>';
  loadEmails();
}

async function doLogout() {
  clearSession();
  if(activeAccountId){
    const nextId=activeAccountId; activeAccountId=null;
    await switchAccount(nextId);
    return;
  }
  $('app').style.display='none'; showAuth('landing');
}

function openCompose() {
  $('compose-modal').classList.add('open');
  $('compose-to').value = ''; $('compose-subject').value = ''; $('compose-body').value = '';
  $('compose-status').textContent = '';
  setTimeout(() => $('compose-to').focus(), 120);
}
function closeCompose() { $('compose-modal').classList.remove('open'); }

async function sendViaEdge(to, subject, text) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/resend-send`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${currentSession.access_token}` },
    body: JSON.stringify({ to, subject: subject || '(no subject)', text })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Send failed');
  return data;
}

async function sendCompose() {
  const to = $('compose-to').value.trim();
  const subject = $('compose-subject').value.trim();
  const body = $('compose-body').value.trim();
  const status = $('compose-status');
  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return (status.textContent = 'enter a valid recipient');
  if (!body) return (status.textContent = 'enter message');
  status.textContent = 'sending...';
  try {
    await sendViaEdge(to, subject, body);
    status.textContent = 'sent!'; showToast('message sent');
    setTimeout(closeCompose, 900); loadEmails();
  } catch (err) { status.textContent = 'failed'; showToast('send failed: ' + err.message); }
}

async function sendReply() {
  const body = $('reply-text').value.trim();
  if (!body || !selectedId) return;
  const email = allEmails.find(e => e.id === selectedId);
  if (!email) return;
  const replyTo = email.from_address || email.from_name;
  if (!replyTo) return showToast('cannot determine recipient');
  try {
    await sendViaEdge(replyTo, `Re: ${email.subject || '(no subject)'}`, body);
    $('reply-text').value = ''; showToast('reply sent'); loadEmails();
  } catch (err) { showToast('reply failed: ' + err.message); }
}

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function stripHtml(html) { if (!html) return ''; const d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || ''; }
function formatDate(ts) { if (!ts) return ''; const d = new Date(ts), now = new Date(), diff = (now - d) / 1000; if (diff < 60) return 'now'; if (diff < 3600) return Math.floor(diff / 60) + 'm'; if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); if (now - d < 7 * 86400 * 1000) return d.toLocaleDateString([], { weekday: 'short' }); return d.toLocaleDateString([], { month: 'short', day: 'numeric' }); }
function formatDateTime(ts) { return ts ? new Date(ts).toLocaleString() : ''; }

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('compose-modal').classList.contains('open')) closeCompose(); });

async function restoreSession() {
  try {
    const saved=storage.getItem('accounts');
    if(saved){const parsed=JSON.parse(saved);accounts=Array.isArray(parsed.accounts)?parsed.accounts.slice(0,MAX_ACCOUNTS):[];activeAccountId=parsed.activeAccountId||accounts[0]?.userId||null;}
    if(!accounts.length){const legacy=storage.getItem('session');if(legacy){const old=JSON.parse(legacy);if(old.session?.user?.id)accounts=[{userId:old.session.user.id,session:old.session,email:old.email||old.session.user.email,username:old.session.user.user_metadata?.username||old.session.user.email?.split('@')[0],avatarUrl:old.session.user.user_metadata?.avatar_url||''}];activeAccountId=accounts[0]?.userId||null;persistAccounts();storage.removeItem('session');}}
    if(!activeAccountId||!accounts.length)return showAuth('landing');
    const active=accounts.find(a=>a.userId===activeAccountId)||accounts[0];activeAccountId=active.userId;currentSession=active.session;myEmail=active.email;
    let res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${currentSession.access_token}`}});
    if(res.status===401&&currentSession.refresh_token){await refreshSession();res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${currentSession.access_token}`}});}
    if(!res.ok)throw new Error('Could not restore account session');
    currentUser=await res.json();active.session=currentSession;active.email=currentUser.email||active.email;active.username=currentUser.user_metadata?.username||active.username;active.avatarUrl=currentUser.user_metadata?.avatar_url||active.avatarUrl;persistAccounts();renderAccountDock();await enterApp();
  }catch(err){console.warn('Session restore failed:',err);showAuth('landing');}
}
restoreSession();

document.addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;
  if ($('login-screen').style.display !== 'none') doLogin();
  else if ($('register-screen').style.display !== 'none') doRegister();
});
