<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailBox · lies.lat</title>
  <style>
    /* ── reset & base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden; background: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── auth screen ── */
    .auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
    .auth-box {
      width: 440px; background: #121212; border: 1px solid #222; border-radius: 12px;
      padding: 48px; box-shadow: 0 24px 64px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center;
    }
    .auth-icon { width: 64px; height: 64px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .auth-icon svg { width: 32px; height: 32px; color: #000; }
    .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .auth-subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; font-weight: 600; color: #eee; }
    .input-group input {
      width: 100%; background: #000; border: 1px solid #333; color: #fff;
      padding: 14px 16px; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #666; }
    .btn-full {
      width: 100%; background: #333; color: #aaa; border: none; padding: 16px;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-full:hover { background: #444; color: #fff; }
    .auth-footer { margin-top: 32px; font-size: 13px; color: #666; }
    
    /* ── app shell ── */
    #app { display: none; height: 100vh; flex-direction: row; background: #000; }
    
    /* ── sidebar ── */
    .sidebar { width: 240px; background: #000; border-right: 1px solid #222; display: flex; flex-direction: column; padding: 16px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin-bottom: 32px; padding: 0 8px; }
    .brand svg { width: 24px; height: 24px; }
    .nav-btn {
      display: flex; align-items: center; gap: 12px; background: transparent; border: 1px solid transparent;
      color: #888; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
      text-align: left; transition: all 0.2s; margin-bottom: 4px;
    }
    .nav-btn:hover { background: #111; color: #fff; }
    .nav-btn.active { background: #fff; color: #000; font-weight: 600; }
    
    .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
    .user-profile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
    .avatar-sm {
      width: 32px; height: 32px; border-radius: 50%; background: #333; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
    }
    .user-email { font-size: 12px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-ghost {
      background: transparent; border: 1px solid #333; color: #ccc; padding: 12px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; width: 100%;
    }
    .btn-ghost:hover { background: #111; border-color: #555; color: #fff; }
    .btn-ghost svg { width: 16px; height: 16px; }

    /* ── email list pane ── */
    .list-pane { width: 360px; border-right: 1px solid #222; display: flex; flex-direction: column; background: #000; flex-shrink: 0; }
    .list-header { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid transparent; }
    .search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 12px; width: 16px; height: 16px; color: #666; }
    .search-wrap input {
      width: 100%; background: #111; border: 1px solid #333; color: #fff;
      padding: 10px 12px 10px 36px; border-radius: 8px; font-size: 13px; outline: none;
    }
    .search-wrap input:focus { border-color: #555; }
    .refresh-btn { background: none; border: none; color: #666; cursor: pointer; padding: 4px; }
    .refresh-btn:hover { color: #fff; }
    .list-title { padding: 12px 24px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #222; }
    
    .email-list { flex: 1; overflow-y: auto; }
    .email-item {
      display: flex; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #111; cursor: pointer; transition: background 0.2s;
    }
    .email-item:hover { background: #0a0a0a; }
    .email-item.active { background: #1a1a1a; border-left: 3px solid #fff; padding-left: 21px; }
    .avatar-md {
      width: 40px; height: 40px; border-radius: 50%; background: #222; color: #888;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0;
    }
    .email-item.active .avatar-md { background: #fff; color: #000; }
    .email-content { flex: 1; min-width: 0; }
    .email-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .email-sender { font-size: 14px; font-weight: 600; color: #eee; }
    .email-date { font-size: 12px; color: #666; white-space: nowrap; }
    .email-subj { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-item.unread .email-sender { color: #fff; }
    .email-item.unread .email-subj { color: #fff; font-weight: 500; }

    /* ── detail pane ── */
    .detail-pane { flex: 1; display: flex; flex-direction: column; background: #000; min-width: 0; }
    .detail-header {
      padding: 20px 32px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .detail-title { font-size: 18px; font-weight: 700; }
    .detail-actions { display: flex; gap: 12px; color: #666; }
    .detail-actions svg { width: 20px; height: 20px; cursor: pointer; transition: color 0.2s; }
    .detail-actions svg:hover { color: #fff; }
    
    .detail-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .detail-meta { padding: 24px 32px; display: flex; gap: 16px; align-items: flex-start; }
    .detail-meta .avatar-md { width: 48px; height: 48px; font-size: 18px; }
    .meta-info { display: flex; flex-direction: column; gap: 4px; }
    .meta-name { font-size: 16px; font-weight: 600; color: #fff; }
    .meta-email { font-size: 13px; color: #888; }
    .meta-date { font-size: 12px; color: #555; margin-top: 4px; }
    
    .email-iframe-container { margin: 0 32px 32px 32px; background: #fff; border-radius: 12px; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
    .email-html-render {
      padding: 40px; color: #333; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100%; overflow-y: auto;
    }
    
    .empty-detail { flex: 1; display: flex; align-items: center; justify-content: center; color: #444; font-size: 15px; font-weight: 500; letter-spacing: 1px; }

    /* ── compose modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #111; border: 1px solid #333; border-radius: 12px; width: 600px; max-width: 95vw; box-shadow: 0 24px 64px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
    .modal-head { padding: 20px 24px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .modal-head span { font-size: 16px; font-weight: 600; }
    .modal-field { padding: 16px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px; }
    .modal-field label { font-size: 13px; color: #666; width: 50px; font-weight: 500; }
    .modal-field input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; }
    .modal-body { padding: 20px 24px; }
    .modal-body textarea { width: 100%; min-height: 200px; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; resize: vertical; line-height: 1.6; }
    .modal-foot { padding: 16px 24px; border-top: 1px solid #222; display: flex; gap: 12px; align-items: center; }
    .btn-solid { background: #fff; color: #000; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn-solid:hover { opacity: 0.8; }
    .btn-text { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; }
    .btn-text:hover { color: #fff; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #fff; color: #000;
      padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
      opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 200; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── AUTH SCREEN ── -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    </div>
    <div class="auth-title" id="auth-title">Welcome Back</div>
    <div class="auth-subtitle" id="auth-subtitle">Sign in to your email account</div>
    
    <div class="auth-form" id="login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="text" id="login-email" placeholder="you@lies.lat" value="@lies.lat">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password">
      </div>
      
      <button class="btn-full" onclick="doLogin()">Sign in</button>
      <div class="auth-footer">
        Don't have an account? <a href="#" onclick="toggleAuth('register')" style="color:#fff;text-decoration:none;">Sign up</a>
      </div>
    </div>

    <div class="auth-form hidden" id="register-form">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="username">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-password">
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-password2">
      </div>
      
      <button class="btn-full" onclick="doRegister()">Create Account</button>
      <div class="auth-footer">
        Already have an account? <a href="#" onclick="toggleAuth('login')" style="color:#fff;text-decoration:none;">Sign in</a>
      </div>
    </div>
    
    <div id="auth-err" style="color:#ef4444; font-size:13px; margin-top:16px; text-align:center; min-height:16px;"></div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      MailBox
    </div>
    
    <button class="nav-btn active" onclick="setFolder('inbox')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9H9l-3-9H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>

    <button class="nav-btn" onclick="setFolder('sent')">

    <div class="sidebar-bottom">
      <div class="user-profile">
        <div class="avatar-sm" id="user-avatar">U</div>
        <div class="user-email" id="user-email-display">user@lies.lat</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer" onclick="doLogout()"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

      <button class="btn-ghost" onclick="openCompose()">

    </div>
  </div>

  <!-- Email List -->
  <div class="list-pane">

        <input type="text" id="search-input" placeholder="Search emails..." oninput="renderEmailList()">

  <!-- Detail Pane -->

    <div class="modal-body">

    <div class="modal-foot">

</div>

  const SUPABASE_URL = 'https://koqpmrebjsfpemmajbvk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_PRtMo_ntCby73M7wz0Zdpw_pKfo22Eu';
  // WARNING: Keep your service role key private if this goes to production. 
  // For this demo, we use it to bypass RLS for simple queries.
  const SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvcXBtcmVianNmcGVtbWFqYnZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MzEzNjMsImV4cCI6MjExMDEwNzM2M30.mfwL9ExYGQ5RwGrK0bkgGExs2Y7EhWRZ5El_ALonJRE';

  let currentUser = null;

  let selectedEmailId = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function toggleAuth(type) {
    document.getElementById('auth-err').textContent = '';
    if (type === 'register') {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('auth-title').textContent = 'Create Account';
      document.getElementById('auth-subtitle').textContent = 'Join mail.lies.lat';
    } else {
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('auth-title').textContent = 'Welcome Back';
      document.getElementById('auth-subtitle').textContent = 'Sign in to your email account';
    }
  }

  async function sbFetch(path, options = {}, useServiceRole = false) {
    const headers = {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    };
    if (useServiceRole) headers['Authorization'] = `Bearer ${SERVICE_ROLE_KEY}`;
    else if (currentSession?.access_token) headers['Authorization'] = `Bearer ${currentSession.access_token}`;
    
    const res = await fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // ── AUTH ──
  async function doLogin() {
    let username = document.getElementById('login-email').value.trim();
    if (!username.includes('@')) username = `${username}@lies.lat`;
    else if (!username.endsWith('@lies.lat')) {
      username = username.split('@')[0] + '@lies.lat';
    }
    
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('auth-err');
    
    if (!username || !password) { errEl.textContent = 'Please fill all fields'; return; }
    
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: username, password })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error_description || 'Invalid login');
      
      currentSession = data;
      currentUser = data.user;
      myEmail = username;
      localStorage.setItem('session', JSON.stringify({ session: data, email: myEmail }));
      
      initApp();
    } catch (err) {
      errEl.textContent = err.message;
    }
  }

  async function doRegister() {
    const rawUser = document.getElementById('reg-username').value.trim().toLowerCase();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const email = `${rawUser}@lies.lat`;
    const errEl = document.getElementById('auth-err');
    
    if (!rawUser || rawUser.length < 2) { errEl.textContent = 'Username too short'; return; }
    if (password.length < 6) { errEl.textContent = 'Password must be 6+ chars'; return; }
    if (password !== password2) { errEl.textContent = 'Passwords do not match'; return; }
    
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, data: { username: rawUser } })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error_description || 'Registration failed');
      
      if (data.access_token) {
        currentSession = data;
        currentUser = data.user;
        myEmail = email;
        localStorage.setItem('session', JSON.stringify({ session: data, email }));
        initApp();
      } else {
        errEl.textContent = 'Account created! Please sign in.';
        setTimeout(() => toggleAuth('login'), 2000);
      }
    } catch (err) {
      errEl.textContent = err.message;
    }
  }

  function doLogout() {
    currentUser = null; currentSession = null; selectedEmailId = null;
    localStorage.removeItem('session');
    if (refreshTimer) clearInterval(refreshTimer);
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    toggleAuth('login');
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('user-email-display').textContent = myEmail;
    document.getElementById('user-avatar').textContent = myEmail.charAt(0).toUpperCase();
    
    loadEmails();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadEmails, 15000);
  }

  // ── APP LOGIC ──
  async function loadEmails() {
    if (!currentUser && !currentSession) return;
    try {
      let query = `/rest/v1/emails?select=*&order=received_at.desc.nullslast`;
      if (currentUser?.id) query += `&user_id=eq.${currentUser.id}`;
      if (currentFolder === 'sent') query += '&folder=eq.sent';
      else if (currentFolder === 'inbox') query += '&is_deleted=eq.false';
      
      const data = await sbFetch(query, {}, true);
      emails = Array.isArray(data) ? data : [];
      renderEmailList();
      
      if (selectedEmailId) {
        const still = emails.find(e => e.id === selectedEmailId);
        if (still) viewEmail(selectedEmailId, true);
        else clearDetail();
      }
    } catch (err) {
      console.error(err);
      document.getElementById('email-list').innerHTML = `<div style="padding:40px; text-align:center; color:#ef4444;">Error: ${err.message}</div>`;
    }
  }

  function renderEmailList() {
    const container = document.getElementById('email-list');
    const search = document.getElementById('search-input')?.value.toLowerCase() || '';
    
    let filtered = emails;
    if (search) {
      filtered = emails.filter(e => 
        (e.subject || '').toLowerCase().includes(search) || 
        (e.from_address || '').toLowerCase().includes(search)
      );
    }
    
    if (filtered.length === 0) {
      container.innerHTML = '<div style="padding:40px; text-align:center; color:#555;">No messages found</div>';
      return;
    }
    
    container.innerHTML = filtered.map(email => {
      const isUnread = !email.is_read;
      const isActive = selectedEmailId === email.id;
      const initial = (email.from_name || email.from_address || 'U').charAt(0).toUpperCase();
      
      return `
        <div class="email-item ${isUnread ? 'unread' : ''} ${isActive ? 'active' : ''}" onclick="viewEmail('${email.id}')">
          <div class="avatar-md">${initial}</div>
          <div class="email-content">
            <div class="email-top">
              <span class="email-sender">${escapeHtml(email.from_name || email.from_address || 'Unknown')}</span>
              <span class="email-date">${formatDate(email.received_at)}</span>
            </div>
            <div class="email-subj">${escapeHtml(email.subject || '(No subject)')}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function viewEmail(id, skipMarkRead = false) {
    const email = emails.find(e => e.id === id);
    if (!email) return;
    
    selectedEmailId = id;
    renderEmailList();
    
    document.getElementById('detail-empty').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    
    document.getElementById('detail-subject').textContent = email.subject || '(No subject)';
    document.getElementById('detail-from-name').textContent = email.from_name || email.from_address || 'Unknown';
    document.getElementById('detail-from-email').textContent = `<${email.from_address}>`;
    document.getElementById('detail-to-email').textContent = email.to_address || myEmail;
    document.getElementById('detail-date').textContent = formatDateTime(email.received_at);
    document.getElementById('detail-avatar').textContent = (email.from_name || email.from_address || 'U').charAt(0).toUpperCase();
    
    const bodyEl = document.getElementById('detail-body-content');
    if (email.body_html) {
      bodyEl.innerHTML = email.body_html;
    } else {
      bodyEl.innerHTML = `<div style="white-space:pre-wrap; font-family:inherit;">${escapeHtml(email.body_text || '')}</div>`;
    }
    
    if (!skipMarkRead && !email.is_read) {
      email.is_read = true;
      try {
        await sbFetch(`/rest/v1/emails?id=eq.${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ is_read: true })
        }, true);
        renderEmailList();
      } catch(e) {}
    }
  }

  function clearDetail() {
    selectedEmailId = null;
    document.getElementById('detail-empty').classList.remove('hidden');
    document.getElementById('detail-view').classList.add('hidden');
    document.getElementById('reply-area').classList.add('hidden');
    renderEmailList();
  }

  function setFolder(folder) {
    currentFolder = folder;
    document.getElementById('folder-title').textContent = folder.charAt(0).toUpperCase() + folder.slice(1);
    
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    const clickedBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => 
      btn.textContent.trim().toLowerCase().includes(folder)
    );
    if (clickedBtn) clickedBtn.classList.add('active');
    
    clearDetail();
    loadEmails();
  }

  // ── COMPOSE & REPLY ──
  function openCompose() {
    document.getElementById('compose-modal').classList.remove('hidden');
    document.getElementById('compose-to').value = '';
    document.getElementById('compose-subject').value = '';
    document.getElementById('compose-body').value = '';
    document.getElementById('compose-status').textContent = '';
  }

  function closeCompose() {
    document.getElementById('compose-modal').classList.add('hidden');
  }

  // Send via your new Supabase Edge Function
  async function sendViaEdge(to, subject, text) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/resend-send`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentSession.access_token}` // Authenticate the request
      },
      body: JSON.stringify({ from: myEmail, to, subject: subject || '(no subject)', text })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Send failed');
    return data;
  }

  async function sendCompose() {
    const to = document.getElementById('compose-to').value.trim();
    const subject = document.getElementById('compose-subject').value.trim();
    const body = document.getElementById('compose-body').value.trim();
    const status = document.getElementById('compose-status');
    
    if (!to || !body) { status.textContent = 'Recipient and message required'; return; }
    status.textContent = 'Sending...';
    
    try {
      await sendViaEdge(to, subject, body);
      await sbFetch('/rest/v1/emails', {
        method: 'POST',
        body: JSON.stringify({
          user_id: currentUser.id, from_address: myEmail, to_address: to,
          subject: subject, body_text: body, folder: 'sent', is_read: true,
          received_at: new Date().toISOString()
        })
      }, true);
      
      status.textContent = 'Sent!';
      showToast('Message sent');
      setTimeout(closeCompose, 1000);
      if (currentFolder === 'sent') loadEmails();
    } catch (err) {
      status.textContent = 'Failed';
      showToast('Send failed: ' + err.message);
    }
  }

  async function sendReply() {
    const body = document.getElementById('reply-text').value.trim();
    if (!body) return;
    
    const currentEmail = emails.find(e => e.id === selectedEmailId);
    if (!currentEmail) return;
    
    try {
      await sendViaEdge(currentEmail.from_address, `Re: ${currentEmail.subject}`, body);
      await sbFetch('/rest/v1/emails', {
        method: 'POST',
        body: JSON.stringify({
          user_id: currentUser.id, from_address: myEmail, to_address: currentEmail.from_address,
          subject: `Re: ${currentEmail.subject}`, body_text: body, folder: 'sent', is_read: true,
          received_at: new Date().toISOString()
        })
      }, true);
      
      document.getElementById('reply-text').value = '';
      document.getElementById('reply-area').classList.add('hidden');
      showToast('Reply sent');
      if (currentFolder === 'sent') loadEmails();
    } catch (err) {
      showToast('Reply failed: ' + err.message);
    }
  }

  // ── UTILS ──
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  }
  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function formatDateTime(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // ── SESSION RESTORE ──
  async function restoreSession() {
    const saved = localStorage.getItem('session');
    if (!saved) return;
    try {
      const { session, email } = JSON.parse(saved);
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        currentSession = session;
        currentUser = await res.json();
        myEmail = email;
        initApp();
      } else localStorage.removeItem('session');
    } catch (e) { localStorage.removeItem('session'); }
  }

  restoreSession();
</script>
